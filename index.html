<title>Pepín y Fresquito</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #062765;
  font-family: Arial, sans-serif;
}
.portada {
  width: 100%;
  min-height: 75vh;
  display: block;
  object-fit: contain;
  background: #092d75;
}
.botones {
  background: linear-gradient(135deg,#08265f,#123d90);
  padding: 45px 20px 55px;
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 22px;
  flex-wrap: wrap;
}
.boton {
  background: white;
  color: #113b83;
  border: 4px solid #c91d30;

  padding: 25px 20px;
  width: 260px;
  min-height: 125px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 8px 20px #0003;
}
.boton .simbolo { font-size: 34px; }
.boton:hover {
  background: #e8f5ff;
  transform: translateY(-3px);
}
.boton.inactivo {
  opacity: .85;
  cursor: default;
}
footer {
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}
@media(max-width:600px) {
  .portada { min-height: 0; }
  .botones { padding: 25px 15px; gap: 15px; }
  .boton { width: 100%; min-height: 90px; }
}
